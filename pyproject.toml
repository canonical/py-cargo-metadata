[project]
name = "cargo-metadata"
version = "1.1.0"
description = "Pydantic types for cargo metadata output"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Crystal Durham", email = "crystal.durham@canonical.com" }]
keywords = ["cargo", "rust", "metadata", "pydantic"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.13.4"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/canonical/py-cargo-metadata"
Repository = "https://github.com/canonical/py-cargo-metadata"
Issues = "https://github.com/canonical/py-cargo-metadata/issues"
Changelog = "https://github.com/canonical/py-cargo-metadata/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.2,<1.0.0",
    "typing-extensions>=4.16.0,<5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
