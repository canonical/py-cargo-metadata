[project]
name = "cargo-metadata"
version = "0.1.0"
description = "Pydantic types for cargo metadata output"
readme = "README.md"
authors = [
    { name = "Crystal Durham", email = "crystal.durham@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-subprocess>=1.5",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
