name: Publish

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Publish to PyPI
    # Runs when a release PR (branch "prepare-release/X.Y.Z", opened by the
    # prepare-release workflow's bot) is merged. Skips when the PR was
    # closed without merging.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.head_ref, 'prepare-release/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      # The closed-PR event's default ref points at the PR head branch, which
      # delete-branch-on-merge removes; check out the merge commit instead.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Record version
        run: echo "RELEASE_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Build package
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Extract release notes
        run: python3 .github/scripts/extract_release_notes.py "$RELEASE_VERSION"
      - name: Create tagged release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: release-notes.md
          make_latest: true
