name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release kind, passed to `uv version --bump`"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Record current version
        run: echo "OLD_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Bump version
        run: uv version --bump "${{ inputs.bump }}"
      - name: Record new version
        run: echo "NEW_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Update changelog
        run: python3 .github/scripts/update_changelog.py "$OLD_VERSION" "$NEW_VERSION"
      - name: Commit to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "prepare-release/$NEW_VERSION"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "Prepare release $NEW_VERSION"
          git push --force origin "prepare-release/$NEW_VERSION"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          body=$(cat <<EOF
          Automated release preparation: bump the version from $OLD_VERSION to
          $NEW_VERSION (uv version --bump $BUMP) and roll the [Unreleased]
          changelog entries into the [$NEW_VERSION] section.

          After merging, dispatch the Publish workflow to upload to PyPI and tag
          the release.
          EOF
          )
          if gh pr view "prepare-release/$NEW_VERSION" >/dev/null 2>&1; then
            gh pr edit "prepare-release/$NEW_VERSION" \
              --title "Prepare release $NEW_VERSION" \
              --body "$body"
          else
            gh pr create \
              --base "$BASE" \
              --head "prepare-release/$NEW_VERSION" \
              --title "Prepare release $NEW_VERSION" \
              --body "$body"
          fi
