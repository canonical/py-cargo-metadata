name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release kind, passed to `uv version --bump`"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Record current version
        run: echo "OLD_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Bump version
        run: uv version --bump "${{ inputs.bump }}"
      - name: Record new version
        run: echo "NEW_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Update changelog
        run: python3 .github/scripts/update_changelog.py "$OLD_VERSION" "$NEW_VERSION" release-notes.md
      - name: Record release notes
        run: |
          delimiter="$(uuidgen)"
          {
            echo "RELEASE_NOTES<<$delimiter"
            cat release-notes.md
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          sign-commits: true
          branch: prepare-release/${{ env.NEW_VERSION }}
          add-paths: |
            pyproject.toml
            uv.lock
            CHANGELOG.md
          commit-message: Prepare release ${{ env.NEW_VERSION }}
          title: Release ${{ env.NEW_VERSION }}
          body: |
            Merging this PR publishes ${{ env.NEW_VERSION }} to PyPI and
            creates the ${{ env.NEW_VERSION }} tag and GitHub release
            automatically.

            ${{ env.RELEASE_NOTES }}
