name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release kind, passed to `uv version --bump`"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Record current version
        run: echo "OLD_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Bump version
        run: uv version --bump "${{ inputs.bump }}"
      - name: Record new version
        run: echo "NEW_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Update changelog
        run: python3 .github/scripts/update_changelog.py "$OLD_VERSION" "$NEW_VERSION" release-notes.md
      - name: Record release notes
        run: |
          {
            echo "RELEASE_NOTES<<NOTES_EOF"
            cat release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_ENV"
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          sign-commits: true
          branch: prepare-release/${{ env.NEW_VERSION }}
          add-paths: |
            pyproject.toml
            uv.lock
            CHANGELOG.md
          commit-message: Prepare release ${{ env.NEW_VERSION }}
          title: Release ${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
